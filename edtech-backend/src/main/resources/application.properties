# ===================================================================
# Cloudflare R2 Configuration
#
# IMPORTANT: You MUST replace the placeholder values below with your
# actual Cloudflare R2 credentials. You can find these in your
# Cloudflare dashboard under R2 > Account Details.
#
# The endpoint URL should NOT include "https://".
# ===================================================================
cloudflare.r2.endpoint=0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d.r2.cloudflarestorage.com
cloudflare.r2.access-key-id=YOUR_CLOUDFLARE_R2_ACCESS_KEY_ID
cloudflare.r2.secret-access-key=YOUR_CLOUDFLARE_R2_SECRET_ACCESS_KEY
cloudflare.r2.region=auto

# ===================================================================
# Spring Datasource Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/edtech
spring.datasource.username=root
spring.datasource.password=Nikunj475@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================================
# JWT Configuration
#
# IMPORTANT: You should use a much more secure secret in production.
# You can generate one using a secure random generator.
# ===================================================================
app.jwt-secret=your-super-secret-key-that-is-at--least-256-bits-long
app.jwt-expiration-milliseconds=604800000

# ===================================================================
# Email Configuration
#
# IMPORTANT: You MUST replace the placeholder values below with your
# email provider's settings.
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
